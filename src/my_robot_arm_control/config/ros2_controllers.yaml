# ros2_control configuration for Panda arm
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController


panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    goal_time: 0.0
    stopped_velocity_tolerance: 0.01
    goal_tolerance:
      - 0.01  # joint1
      - 0.01  # joint2
      - 0.01  # joint3
      - 0.01  # joint4
      - 0.01  # joint5
      - 0.01  # joint6
      - 0.01  # joint7


panda_hand_controller:
  ros__parameters:
    joints:
      - panda_finger_joint1
      - panda_finger_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
    goal_time: 0.0
    # Physical contact may stop each finger before the zero-width target.
    # Dual-contact validation in the task node remains the lift safety gate.
    stopped_velocity_tolerance: 0.01
    constraints:
      goal_time: 0.0
      panda_finger_joint1:
        goal: 0.01
      panda_finger_joint2:
        goal: 0.01
