# Five-object physical-contact pick-and-place task for Gazebo Sim.
# Units: metres, seconds, kilograms and quaternion components.
pick_place_node:
  ros__parameters:
    arm_group_name: panda_arm
    gripper_group_name: hand
    base_frame: panda_link0
    tool_link: panda_link8
    use_physical_contacts: true
    planning_only: false

    # Conservative Cartesian clearances for top-down grasps.  panda_link8 is
    # ~0.098 m above the fingertips (hand-to-finger origin 0.0584 m + finger
    # half-length ~0.04 m).  grasp_z_offset raises link8 above the object
    # centre so the fingertips straddle the object instead of penetrating the
    # table.  place_z_offset serves the same purpose during the lower stage.
    grasp_z_offset: 0.103
    place_z_offset: 0.103
    approach_height: 0.10
    lift_height: 0.12
    place_approach_height: 0.10
    retreat_height: 0.12
    planning_attempts: 3
    grasp_attempts: 2
    planning_retry_delay: 0.5
    contact_timeout: 2.0
    contact_settle_duration: 0.20
    contact_max_age: 0.30
    # Close using reachable 5 mm trajectories and stop immediately once both
    # fingers have recent contact with the selected object.
    gripper_close_step: 0.005
    gripper_close_settle_duration: 0.10
    post_release_settle_duration: 0.75
    startup_delay: 8.0
    cycle_delay: 2.0
    random_seed: -1  # Negative value means a fresh random order every cycle.
    autorun: true
    run_forever: false
    reset_world_between_cycles: true

    # ROS 2 parameters do not support arrays of maps, so the catalog is JSON.
    # Poses are object centres; each destination is a physically separate pad.
    object_catalog_json: >-
      [{"id":"box_small","gazebo_model":"box_small","shape":"box","dimensions":[0.035,0.045,0.040],"mass":0.060,"gripper_opening":0.0,"pick_pose":[0.38,-0.22,0.445],"place_pose":[0.34,0.25,0.451]},{"id":"box_medium","gazebo_model":"box_medium","shape":"box","dimensions":[0.055,0.040,0.050],"mass":0.090,"gripper_opening":0.0,"pick_pose":[0.50,-0.16,0.450],"place_pose":[0.50,0.25,0.456]},{"id":"box_large","gazebo_model":"box_large","shape":"box","dimensions":[0.070,0.045,0.060],"mass":0.120,"gripper_opening":0.0,"pick_pose":[0.62,-0.22,0.455],"place_pose":[0.66,0.25,0.461]},{"id":"cylinder_small","gazebo_model":"cylinder_small","shape":"cylinder","dimensions":[0.022,0.050],"mass":0.065,"gripper_opening":0.0,"pick_pose":[0.42,0.03,0.450],"place_pose":[0.42,0.42,0.456]},{"id":"cylinder_large","gazebo_model":"cylinder_large","shape":"cylinder","dimensions":[0.032,0.060],"mass":0.100,"gripper_opening":0.0,"pick_pose":[0.58,0.03,0.455],"place_pose":[0.58,0.42,0.461]}]

    grasp_orientation: [1.0, 0.0, 0.0, 0.0]
    place_orientation: [1.0, 0.0, 0.0, 0.0]
